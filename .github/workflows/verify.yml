name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify Live2D assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            public/live2d/live2dcubismcore.min.js
            public/live2d/rice/Rice.model3.json
            public/live2d/fuxuan/符玄.model3.json
            public/live2d/huohuo/藿藿.model3.json
            public/live2d/jian/简.model3.json
            public/live2d/jingliu/镜流.model3.json
            public/live2d/kafka/kafuka1.model3.json
            public/live2d/nicole/Nicole.model3.json
            public/live2d/robin/知更鸟.model3.json
            public/live2d/yangyang/秧秧.model3.json
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required asset: $file"; exit 1; }
          done
          echo "Live2D assets present: $(du -sh public/live2d | cut -f1)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build

      - name: Build unpacked macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac:dir

      - name: Smoke test packaged macOS app
        shell: bash
        run: |
          set -euo pipefail
          app_bin="$(find release -type f -path '*/Desktop Pet.app/Contents/MacOS/Desktop Pet' | head -n 1)"
          test -n "$app_bin" || { echo "Packaged app binary not found"; exit 1; }
          DESKTOP_PET_SMOKE=1 "$app_bin" --smoke

      - name: Build macOS DMGs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac

      - name: Upload macOS DMGs
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-macos
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7
